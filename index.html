<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Bütçe Takip Sistemi</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #4a90e2;
            --income-color: #2ecc71;
            --expense-color: #e74c3c;
            --border-radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        /* Özet Kartları Paneli */
        .summary-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        .card h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .balance p { color: var(--primary); }
        .income p { color: var(--income-color); }
        .expense p { color: var(--expense-color); }

        /* Form ve Liste Bölümü */
        .main-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }

        form {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        /* İşlem Listesi */
        .history {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .list {
            list-style-type: none;
            max-height: 320px;
            overflow-y: auto;
        }

        .list li {
            background-color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            position: relative;
            border-right: 5px solid #ccc;
        }

        .list li.plus { border-right-color: var(--income-color); }
        .list li.minus { border-right-color: var(--expense-color); }

        .delete-btn {
            cursor: pointer;
            background-color: transparent;
            color: #ccc;
            border: none;
            font-size: 1.1rem;
            padding: 0 5px;
            margin-left: 10px;
            width: auto;
        }

        .delete-btn:hover {
            color: var(--expense-color);
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Bütçe Yönetim Paneli</h1>
            <p>Gelir ve giderlerinizi kolayca takip edin</p>
        </header>

        <div class="summary-container">
            <div class="card balance">
                <h3>Net Bakiye</h3>
                <p id="balance">0.00 ₺</p>
            </div>
            <div class="card income">
                <h3>Toplam Gelir</h3>
                <p id="money-plus">+0.00 ₺</p>
            </div>
            <div class="card expense">
                <h3>Toplam Gider</h3>
                <p id="money-minus">-0.00 ₺</p>
            </div>
        </div>

        <div class="main-content">
            <div>
                <h2 class="section-title">Yeni İşlem Ekle</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="text">Açıklama</label>
                        <input type="text" id="text" placeholder="Örn: Market, Maaş, Burs..." required />
                    </div>
                    <div class="form-group">
                        <label for="type">İşlem Türü</label>
                        <select id="type">
                            <option value="income">Gelir</option>
                            <option value="expense">Gider</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="amount">Tutar (₺)</label>
                        <input type="number" step="0.01" id="amount" placeholder="0.00" required />
                    </div>
                    <button type="submit">İşlemi Kaydet</button>
                </form>
            </div>

            <div>
                <h2 class="section-title">İşlem Geçmişi</h2>
                <div class="history">
                    <ul id="list" class="list">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elemanları
        const balance = document.getElementById('balance');
        const money_plus = document.getElementById('money-plus');
        const money_minus = document.getElementById('money-minus');
        const list = document.getElementById('list');
        const form = document.getElementById('transaction-form');
        const text = document.getElementById('text');
        const amount = document.getElementById('amount');
        const type = document.getElementById('type');

        // LocalStorage'dan verileri çekme (Yoksa boş dizi)
        const localStorageTransactions = JSON.parse(localStorage.getItem('transactions'));
        let transactions = localStorage.getItem('transactions') !== null ? localStorageTransactions : [];

        // Yeni İşlem Ekleme Fonksiyonu
        function addTransaction(e) {
            e.preventDefault();

            if (text.value.trim() === '' || amount.value.trim() === '') {
                alert('Lütfen açıklama ve tutar alanlarını doldurun.');
                return;
            }

            // Gider seçildiyse tutarı eksiye çeviriyoruz
            let transactionAmount = parseFloat(amount.value);
            if (type.value === 'expense') {
                transactionAmount = -Math.abs(transactionAmount);
            } else {
                transactionAmount = Math.abs(transactionAmount);
            }

            const transaction = {
                id: generateID(),
                text: text.value,
                amount: transactionAmount
            };

            transactions.push(transaction);
            addTransactionDOM(transaction);
            updateValues();
            updateLocalStorage();

            // Formu temizle
            text.value = '';
            amount.value = '';
            type.value = 'income';
        }

        // Rastgele ID Üretici
        function generateID() {
            return Math.floor(Math.random() * 100000000);
        }

        // İşlemleri Arayüze (DOM) Ekleme
        function addTransactionDOM(transaction) {
            // Gelir mi gider mi kontrolü
            const sign = transaction.amount < 0 ? '-' : '+';
            const item = document.createElement('li');

            // Tutara göre sınıf ekleme
            item.classList.add(transaction.amount < 0 ? 'minus' : 'plus');

            item.innerHTML = `
                ${transaction.text} <span>${sign}${Math.abs(transaction.amount).toFixed(2)} ₺</span>
                <button class="delete-btn" onclick="removeTransaction(${transaction.id})">x</button>
            `;

            list.appendChild(item);
        }

        // Toplam Bakiyeyi, Gelir ve Gideri Güncelleme
        function updateValues() {
            const amounts = transactions.map(transaction => transaction.amount);

            const total = amounts.reduce((acc, item) => (acc += item), 0).toFixed(2);

            const income = amounts
                .filter(item => item > 0)
                .reduce((acc, item) => (acc += item), 0)
                .toFixed(2);

            const expense = (
                amounts.filter(item => item < 0).reduce((acc, item) => (acc += item), 0) * -1
            ).toFixed(2);

            balance.innerText = `${total} ₺`;
            money_plus.innerText = `+${income} ₺`;
            money_minus.innerText = `-${expense} ₺`;
        }

        // İşlem Silme Fonksiyonu
        function removeTransaction(id) {
            transactions = transactions.filter(transaction => transaction.id !== id);
            updateLocalStorage();
            init();
        }

        // LocalStorage Güncelleme
        function updateLocalStorage() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        // Uygulamayı Başlatma
        function init() {
            list.innerHTML = '';
            transactions.forEach(addTransactionDOM);
            updateValues();
        }

        init();

        // Form Gönderimini Dinleme
        form.addEventListener('submit', addTransaction);
    </script>
</body>
</html>
